<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@motifx-community/i18n · translations example</title>
    <style>
      :root { color-scheme: light; }
      body { font: 16px/1.5 system-ui, 'Segoe UI', Tahoma, sans-serif; margin: 0; color: #1d2433; background: #f6f7f9; }
      .app { max-width: 40rem; margin: 0 auto; padding: 1.5rem; }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 1.5rem; }
      .langs { display: flex; gap: 0.35rem; }
      .langs button { font: inherit; padding: 0.25rem 0.7rem; border: 1px solid #c8cfdb; border-radius: 0.35rem; background: #fff; cursor: pointer; }
      .langs button.is-active { background: #2458e6; border-color: #2458e6; color: #fff; }
      .card { background: #fff; border: 1px solid #e3e7ee; border-radius: 0.5rem; padding: 1rem; margin-block-start: 1rem; display: grid; gap: 0.6rem; }
      .card input { font: inherit; padding: 0.3rem 0.5rem; border: 1px solid #c8cfdb; border-radius: 0.35rem; max-inline-size: 14rem; }
      .row { display: flex; align-items: center; gap: 0.5rem; }
      .row button { font: inherit; inline-size: 2rem; border: 1px solid #c8cfdb; border-radius: 0.35rem; background: #fff; cursor: pointer; }
      .muted { color: #68718a; font-size: 0.9rem; }
      a { color: #2458e6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
